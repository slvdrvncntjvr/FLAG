name: Baseline verification

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baseline-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'
  WRANGLER_SEND_METRICS: 'false'

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Retain full project history and tags.
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The canonical engine is private; public CI must remain credential-free.
      - name: Notice - canonical SPINE validation is a LOCAL release gate
        run: |
          echo '::notice::Canonical SPINE 0.3.0 documentation and checkpoint validation requires the owner-installed pinned engine and is a LOCAL release gate. Hosted CI does not run or claim these checks passed. Locally run: python scripts/spine.py check docs/ and python scripts/spine.py checkpoint verify.'
      - name: Pinned-runner and recovery safety tests (self-contained fixtures)
        working-directory: .
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Install exact lockfile
        run: npm ci
      - name: Check application, integration-test, and E2E TypeScript
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Workers integration tests
        run: npm test
      - name: Deployment boundary and R2 policy unit tests
        run: npm run test:deploy
      - name: Local setup safety regression tests
        run: node --test scripts/setup-local.test.mjs
      - name: Build dev Worker
        run: npm run build:worker:dev
      - name: Run packaged Worker with isolated local bindings
        run: npm run test:worker:smoke
      - name: Validate dev bindings and package Worker without uploading
        run: |
          node scripts/check-deploy.mjs dev
          npx --no-install wrangler deploy --env dev --dry-run --outdir "$RUNNER_TEMP/flag-worker-dry-run"
      - name: Install Chromium and Linux browser dependencies
        run: npx --no-install playwright install --with-deps chromium
      - name: Local auth and onboarding browser tests
        run: npm run test:e2e

  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
      # Audit the complete locked graph, including build/test dependencies.
      # High/critical findings fail this job; lower findings remain visible in its log.
      # No audit fix, omission, severity suppression, or continue-on-error exception.
      - name: Reject high or critical dependency advisories
        run: npm audit --audit-level=high
      - name: Audit production dependency graph
        run: npm audit --omit=dev --audit-level=high
